<!DOCTYPE html>
<html>

body {

    <body>
        <h1>Welcome to Ancilin's Pink Paradise!

        <button onclick="alert('HEYYY How are you...ITZ Ancilin Johnson Here!!! 💗')">
    Click Me! 💗
</button><h2>Daily Compliment 💗</h2>

<p id="compliment">Click the button for a surprise!</p>

<button onclick="giveCompliment()">
    Give me a compliment 🎀
</button>
<h2>Spread Some Love 💗</h2>

<p id="heartCount">❤️ 0</p>

<button onclick="addHeart()">

</button>
<script>
function giveCompliment() {

    let compliments = [
        "You are beautiful! 🌸",
        "You are amazing! 💗",
        "Keep shining! ✨",
        "You are special! 🎀",
        "You deserve happiness! 🌷"
    ];

    let randomNumber = Math.floor(Math.random() * compliments.length);

    document.getElementById("compliment").innerHTML = compliments[randomNumber];

}
let hearts = 0;

function addHeart() {

    hearts = hearts + 1;

    document.getElementById("heartCount").innerHTML = "❤️ " + hearts;

}
function showSurprise() {

    document.getElementById("surprise").innerHTML =
    "✨ Lots of Love.....ANCILIN JOHNSON! 💗";

}
</script>
<h2>A Little Surprise 🎀</h2>

    Open My Surprise 💗
</button>
